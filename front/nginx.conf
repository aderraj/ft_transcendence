# Frontend Nginx - HTTP only (WAF reverse proxy handles HTTPS/SSL termination)
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent port in redirects when behind reverse proxy
    port_in_redirect off;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # For SPA: serve index.html for any non-file request (no $uri/ to avoid redirects)
        try_files $uri /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}