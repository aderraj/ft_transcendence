server {
    listen 80;
    server_name localhost;

    # Serve static files from the build directory
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for speed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handle React Router (SPA)
    # If the file exists, serve it. If not, fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets (images, css, js) for 1 year
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Health check endpoint (optional but good for Docker/K8s)
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}