# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'Pong Dashboards'
    orgId: 1
    folder: 'ft_transcendence'
    folderUid: 'pong-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
