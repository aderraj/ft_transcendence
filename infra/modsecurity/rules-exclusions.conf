# ModSecurity CRS Rule Exclusions for ft_transcendence
# These exclusions prevent false positives while maintaining security

# ============================================
# Rule 920350: Host header is a numeric IP address
# Reason: Development/internal environments use IP addresses
# ============================================
SecRuleRemoveById 920350

# ============================================
# Rule 942100: SQL Injection Attack Detected via libinjection
# Reason: False positive on password fields containing special characters
# Applied only to authentication endpoints
# ============================================
SecRule REQUEST_URI "@beginsWith /api/auth/" \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:password,\
    ctl:ruleRemoveTargetById=942100;ARGS:newPassword,\
    ctl:ruleRemoveTargetById=942100;ARGS:confirmPassword"

# ============================================
# Rule 920420: Request content type is not allowed
# Reason: Allow JSON content type for API requests
# ============================================
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:1001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920420"

# ============================================
# Rule 932236 & 932237: Remote Command Execution
# Reason: False positives on chat messages
# Applied only to chat endpoints
# ============================================
SecRule REQUEST_URI "@beginsWith /api/chat" \
    "id:1002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=932236;ARGS:message,\
    ctl:ruleRemoveTargetById=932237;ARGS:message,\
    ctl:ruleRemoveTargetById=942100;ARGS:message"

# ============================================
# Rule 941100-941160: XSS Attacks
# Reason: False positives on display names with special chars
# Applied only to specific fields
# ============================================
SecRule REQUEST_URI "@beginsWith /api/auth/register" \
    "id:1003,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=941100;ARGS:displayName,\
    ctl:ruleRemoveTargetById=941110;ARGS:displayName"

# ============================================
# Allow WebSocket upgrade requests
# ============================================
SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:1004,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off"
