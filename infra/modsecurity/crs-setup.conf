# OWASP CRS Setup Configuration for ft_transcendence
# This file configures the Core Rule Set behavior

# ============================================
# Paranoia Level (1-4)
# Level 1: Balanced detection (recommended for production)
# Level 2: Higher detection with some false positives
# Level 3: Even higher detection, more false positives
# Level 4: Maximum detection, expect false positives
# ============================================
SecAction \
    "id:900000,\
    phase:1,\
    pass,\
    nolog,\
    setvar:tx.paranoia_level=1"

# ============================================
# Anomaly Scoring Mode
# ============================================
SecAction \
    "id:900110,\
    phase:1,\
    pass,\
    nolog,\
    setvar:tx.inbound_anomaly_score_threshold=10,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# ============================================
# Allowed HTTP Methods
# ============================================
SecAction \
    "id:900200,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# ============================================
# Allowed Content Types
# ============================================
SecAction \
    "id:900220,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|'"

# ============================================
# File Upload Settings
# ============================================
SecAction \
    "id:900300,\
    phase:1,\
    pass,\
    nolog,\
    setvar:tx.max_file_size=10485760,\
    setvar:tx.combined_file_sizes=20971520"

# ============================================
# Sampling Settings (disabled for full protection)
# ============================================
SecAction \
    "id:900400,\
    phase:1,\
    pass,\
    nolog,\
    setvar:tx.sampling_percentage=100"

# ============================================
# IP Reputation (disabled by default)
# ============================================
SecAction \
    "id:900500,\
    phase:1,\
    pass,\
    nolog,\
    setvar:tx.do_reput_block=0"

# ============================================
# Detection Only Mode (set to 0 for blocking)
# ============================================
SecAction \
    "id:900990,\
    phase:1,\
    pass,\
    nolog,\
    setvar:tx.blocking_paranoia_level=1"
