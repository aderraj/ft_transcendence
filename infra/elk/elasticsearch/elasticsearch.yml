# ============================================
# Elasticsearch Configuration
# ============================================

cluster.name: "pong-cluster"
network.host: 0.0.0.0

# Single node discovery (for development)
discovery.type: single-node

# Security enabled
xpack.security.enabled: true
xpack.security.enrollment.enabled: false

# Use built-in elastic user (password set via ELASTIC_PASSWORD env var)

# SSL/TLS Configuration
xpack.security.http.ssl:
  enabled: true
  key: /usr/share/elasticsearch/config/certs/elasticsearch.pkcs8.key
  certificate: /usr/share/elasticsearch/config/certs/elasticsearch.crt
  verification_mode: none # Don't verify client certs

xpack.security.transport.ssl:
  enabled: true
  key: /usr/share/elasticsearch/config/certs/elasticsearch.pkcs8.key
  certificate: /usr/share/elasticsearch/config/certs/elasticsearch.crt
  verification_mode: none

# Memory lock
bootstrap.memory_lock: true

# Allow auto index creation
action.auto_create_index: true
