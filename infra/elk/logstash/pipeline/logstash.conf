# ============================================
# Logstash Pipeline Configuration
# Collects logs from all ft_transcendence services
# ============================================

input {
  # Receive logs from Filebeat
  beats {
    port => 5044
  }

  # Receive logs via TCP (for direct logging)
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp_input"]
  }
}

filter {
  # Add container name if present in docker metadata
  if [container][name] {
    mutate {
      add_field => { "container_name" => "%{[container][name]}" }
    }
  }

  # Parse backend logs (NestJS)
  if [container_name] =~ /pong-backend/ {
    mutate {
      add_field => { "service" => "backend" }
      add_tag => ["nestjs", "application"]
    }
    
    # Parse NestJS log format
    grok {
      match => { "message" => "\[%{WORD:nest_context}\] %{GREEDYDATA:log_message}" }
      overwrite => [ "message" ]
      tag_on_failure => ["_grok_nestjs_failure"]
    }
  }

  # Parse WAF/Nginx logs
  if [container_name] =~ /pong-waf/ {
    mutate {
      add_field => { "service" => "waf" }
      add_tag => ["nginx", "modsecurity", "security"]
    }
    
    # Parse Nginx access log format
    grok {
      match => { "message" => "%{IPORHOST:client_ip} - - \[%{HTTPDATE:timestamp}\] \"%{WORD:http_method} %{URIPATHPARAM:request_path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status_code} %{NUMBER:bytes}" }
      tag_on_failure => ["_grok_nginx_failure"]
    }

    # Flag blocked requests (403)
    if [status_code] == "403" {
      mutate {
        add_tag => ["security_event", "blocked_request"]
      }
    }

    # Flag server errors (5xx)
    if [status_code] =~ /^5/ {
      mutate {
        add_tag => ["server_error"]
      }
    }
  }

  # Parse Vault logs
  if [container_name] =~ /pong-vault/ {
    mutate {
      add_field => { "service" => "vault" }
      add_tag => ["vault", "secrets", "security"]
    }
  }

  # Parse PostgreSQL logs
  if [container_name] =~ /pong-postgres/ {
    mutate {
      add_field => { "service" => "database" }
      add_tag => ["postgresql", "database"]
    }
  }

  # Parse Frontend logs
  if [container_name] =~ /pong-frontend/ {
    mutate {
      add_field => { "service" => "frontend" }
      add_tag => ["vite", "react"]
    }
  }

  # Add project tag to all logs
  mutate {
    add_field => { "project" => "ft_transcendence" }
  }

  # Parse JSON messages if present
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed_json"
      skip_on_invalid_json => true
    }
  }

  # Remove unnecessary fields to save space
  mutate {
    remove_field => ["agent", "ecs", "input", "host"]
  }
}

output {
  # Send all logs to Elasticsearch
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    index => "pong-logs-%{+YYYY.MM.dd}"
    ssl => true
    ssl_certificate_verification => false
    user => "elastic"
    password => "${ELASTICSEARCH_PASSWORD}"
  }

  # Security events go to a separate index
  if "security_event" in [tags] {
    elasticsearch {
      hosts => ["https://elasticsearch:9200"]
      index => "pong-security-%{+YYYY.MM.dd}"
      ssl => true
      ssl_certificate_verification => false
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
    }
  }

  # Debug output (remove in production)
  # stdout { codec => rubydebug }
}
