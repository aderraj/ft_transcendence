services:
  # ... (ssl-init and postgres remain the same) ...
  ssl-init:
    image: alpine:latest
    container_name: transcendence-ssl-init
    volumes:
      - ./ssl:/ssl
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -f /ssl/cert.pem ] || [ ! -f /ssl/key.pem ]; then
          echo '🔐 Generating SSL certificates...';
          apk add --no-cache openssl;
          mkdir -p /ssl;
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /ssl/key.pem \
            -out /ssl/cert.pem \
            -subj "/C=US/ST=State/L=City/O=Transcendence/CN=$${HOST_IP:-localhost}" \
            -addext "subjectAltName = IP:$${HOST_IP:-127.0.0.1},DNS:$${HOST_IP:-localhost}.nip.io";
          chmod 644 /ssl/cert.pem /ssl/key.pem;
          echo '✅ SSL certificates generated successfully';
        else
          echo '✅ SSL certificates already exist';
        fi
    environment:
      - HOST_IP=${HOST_IP:-localhost}
    networks:
      - transcendence-network

  postgres:
    image: postgres:16-alpine
    container_name: transcendence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-transcendence} -d ${POSTGRES_DB:-transcendence}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - transcendence-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: transcendence-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-transcendence}:${POSTGRES_PASSWORD:-transcendence}@postgres:5432/${POSTGRES_DB:-transcendence}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      OAUTH_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID}
      OAUTH_42_CLIENT_SECRET: ${OAUTH_42_CLIENT_SECRET}
      OAUTH_42_CALLBACK_URL: ${OAUTH_42_CALLBACK_URL:-http://localhost:3001/api/auth/42/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      USE_HTTPS: ${USE_HTTPS:-false}
      HOST_IP: ${HOST_IP:-localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
      - ./ssl:/app/ssl:ro
    depends_on:
      ssl-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z localhost 3001 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - transcendence-network

  frontend:
    build:
      context: .
      dockerfile: ./front/Dockerfile
    container_name: transcendence-frontend
    restart: unless-stopped
    ports:
      - '3000:443'
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-https://localhost:3001}
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      ssl-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'https://localhost:443/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - transcendence-network

  game:
    build:
      context: .
      dockerfile: ./ft_transcendence-pong_game/Dockerfile
    container_name: transcendence-game
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-transcendence}:${POSTGRES_PASSWORD:-transcendence}@postgres:5432/${POSTGRES_DB:-transcendence}?schema=public
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - ./ft_transcendence-pong_game:/app/ft_transcendence-pong_game
      - /app/ft_transcendence-pong_game/node_modules
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z localhost 3002 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - transcendence-network

networks:
  transcendence-network:
    driver: bridge

volumes:
  postgres_data: