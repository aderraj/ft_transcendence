<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcendence API Test</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-info:hover {
            background: #138496;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .output {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .success {
            color: #28a745;
            font-weight: 600;
        }

        .error {
            color: #dc3545;
            font-weight: 600;
        }

        .info {
            color: #17a2b8;
        }

        .token-display {
            background: #fff3cd;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            border: 1px solid #ffc107;
            word-break: break-all;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-online {
            background: #d4edda;
            color: #155724;
        }

        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }

        .chat-messages {
            max-height: 200px;
            overflow-y: auto;
            background: white;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .chat-message {
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 5px;
            background: #e9ecef;
        }

        .chat-message.sent {
            background: #cfe2ff;
            text-align: right;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .links {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .link-btn {
            padding: 10px 20px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid #667eea;
        }

        .link-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Transcendence API Tester</h1>
            <p>Test your NestJS backend with 42 OAuth, JWT, and WebSocket Chat</p>
            <div class="links">
                <a href="http://localhost:3001/api" target="_blank" class="link-btn">📚 Swagger Docs</a>
                <a href="http://localhost:3001/api/auth/42" target="_blank" class="link-btn">🔐 42 OAuth Login</a>
            </div>
        </div>

        <div class="content">
            <!-- Authentication Section -->
            <div class="section">
                <h2>🔐 Authentication</h2>
                
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="authEmail" placeholder="user@example.com" value="test@example.com">
                </div>
                
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="authPassword" placeholder="Min 8 characters" value="password123">
                </div>

                <button class="btn btn-primary" onclick="register()">Register</button>
                <button class="btn btn-success" onclick="login()">Login</button>
                
                <div id="tokenDisplay" class="token-display" style="display: none;">
                    <strong>🔑 JWT Token:</strong>
                    <div id="tokenValue" style="margin-top: 5px;"></div>
                </div>

                <div id="authOutput" class="output"></div>
            </div>

            <!-- WebSocket Chat Section -->
            <div class="section">
                <h2>💬 WebSocket Chat <span id="wsStatus" class="status-badge status-offline">Disconnected</span></h2>
                
                <div class="form-group">
                    <label>Your User ID (from registration/login):</label>
                    <input type="text" id="userId" placeholder="Enter your user ID">
                </div>

                <button class="btn btn-info" onclick="connectWebSocket()">Connect to Chat</button>
                <button class="btn btn-secondary" onclick="disconnectWebSocket()">Disconnect</button>
                <button class="btn btn-primary" onclick="sendPing()">Send Ping</button>

                <div class="chat-messages" id="chatMessages"></div>

                <div class="form-group">
                    <label>Recipient User ID:</label>
                    <input type="text" id="recipientId" placeholder="Friend's user ID">
                </div>

                <div class="form-group">
                    <label>Message:</label>
                    <textarea id="chatMessage" rows="3" placeholder="Type your message..."></textarea>
                </div>

                <button class="btn btn-primary" onclick="sendMessage()">Send Message</button>

                <div id="chatOutput" class="output"></div>
            </div>

            <!-- API Testing Section -->
            <div class="section">
                <h2>🧪 Quick API Tests</h2>
                
                <button class="btn btn-primary" onclick="testSwagger()">Open Swagger UI</button>
                <button class="btn btn-info" onclick="testHealthCheck()">Check API Health</button>
                <button class="btn btn-success" onclick="test42OAuth()">Test 42 OAuth</button>

                <div id="testOutput" class="output"></div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let currentToken = null;
        let currentUserId = null;

        // Authentication Functions
        async function register() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const output = document.getElementById('authOutput');

            output.innerHTML = '<span class="info">Registering user...</span>';

            try {
                const response = await fetch('http://localhost:3001/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    currentToken = data.access_token;
                    currentUserId = data.user.id;
                    document.getElementById('userId').value = data.user.id;
                    displayToken(data.access_token);
                    output.innerHTML = `<span class="success">✅ Registration Successful!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    output.innerHTML = `<span class="error">❌ Registration Failed</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                output.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        async function login() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const output = document.getElementById('authOutput');

            output.innerHTML = '<span class="info">Logging in...</span>';

            try {
                const response = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    currentToken = data.access_token;
                    currentUserId = data.user.id;
                    document.getElementById('userId').value = data.user.id;
                    displayToken(data.access_token);
                    output.innerHTML = `<span class="success">✅ Login Successful!</span>\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    output.innerHTML = `<span class="error">❌ Login Failed</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                output.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        function displayToken(token) {
            document.getElementById('tokenDisplay').style.display = 'block';
            document.getElementById('tokenValue').textContent = token;
        }

        // WebSocket Functions
        function connectWebSocket() {
            const userId = document.getElementById('userId').value;
            const output = document.getElementById('chatOutput');

            if (!userId) {
                output.innerHTML = '<span class="error">❌ Please enter your User ID first!</span>';
                return;
            }

            output.innerHTML = '<span class="info">Connecting to chat server...</span>';

            socket = io('http://localhost:3001/chat', {
                query: { userId: userId }
            });

            socket.on('connect', () => {
                document.getElementById('wsStatus').textContent = 'Connected';
                document.getElementById('wsStatus').className = 'status-badge status-online';
                output.innerHTML = `<span class="success">✅ Connected to chat! Socket ID: ${socket.id}</span>`;
                addChatMessage('System', 'Connected to chat server', 'info');
            });

            socket.on('disconnect', () => {
                document.getElementById('wsStatus').textContent = 'Disconnected';
                document.getElementById('wsStatus').className = 'status-badge status-offline';
                addChatMessage('System', 'Disconnected from chat server', 'error');
            });

            socket.on('messageReceived', (data) => {
                addChatMessage(data.from.username, data.content, 'received');
                output.innerHTML = `<span class="success">✅ New message received!</span>\n\n${JSON.stringify(data, null, 2)}`;
            });

            socket.on('userOnline', (data) => {
                addChatMessage('System', `User ${data.userId} is now online`, 'info');
            });

            socket.on('userOffline', (data) => {
                addChatMessage('System', `User ${data.userId} is now offline`, 'info');
            });

            socket.on('pong', (data) => {
                output.innerHTML = `<span class="success">✅ Pong received!</span>\n\n${JSON.stringify(data, null, 2)}`;
            });

            socket.on('error', (error) => {
                output.innerHTML = `<span class="error">❌ Socket Error: ${error}</span>`;
            });
        }

        function disconnectWebSocket() {
            if (socket) {
                socket.disconnect();
                socket = null;
                document.getElementById('chatOutput').innerHTML = '<span class="info">Disconnected from chat</span>';
            }
        }

        function sendPing() {
            const output = document.getElementById('chatOutput');
            
            if (!socket || !socket.connected) {
                output.innerHTML = '<span class="error">❌ Not connected to chat server!</span>';
                return;
            }

            socket.emit('ping');
            output.innerHTML = '<span class="info">Ping sent... waiting for pong</span>';
        }

        function sendMessage() {
            const output = document.getElementById('chatOutput');
            const recipientId = document.getElementById('recipientId').value;
            const message = document.getElementById('chatMessage').value;

            if (!socket || !socket.connected) {
                output.innerHTML = '<span class="error">❌ Not connected to chat server!</span>';
                return;
            }

            if (!recipientId || !message) {
                output.innerHTML = '<span class="error">❌ Please fill in recipient ID and message!</span>';
                return;
            }

            socket.emit('sendMessage', {
                toId: recipientId,
                content: message
            }, (response) => {
                if (response.success) {
                    addChatMessage('You', message, 'sent');
                    document.getElementById('chatMessage').value = '';
                    output.innerHTML = `<span class="success">✅ Message sent!</span>\n\n${JSON.stringify(response, null, 2)}`;
                } else {
                    output.innerHTML = `<span class="error">❌ Failed to send message</span>\n\n${JSON.stringify(response, null, 2)}`;
                }
            });
        }

        function addChatMessage(from, content, type) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${type}`;
            messageDiv.innerHTML = `<strong>${from}:</strong> ${content}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // API Testing Functions
        function testSwagger() {
            window.open('http://localhost:3001/api', '_blank');
            document.getElementById('testOutput').innerHTML = '<span class="success">✅ Opening Swagger UI in new tab...</span>';
        }

        function test42OAuth() {
            window.open('http://localhost:3001/api/auth/42', '_blank');
            document.getElementById('testOutput').innerHTML = '<span class="info">🔐 Opening 42 OAuth login in new tab...</span>';
        }

        async function testHealthCheck() {
            const output = document.getElementById('testOutput');
            output.innerHTML = '<span class="info">Checking API health...</span>';

            try {
                const response = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'OPTIONS'
                });

                if (response.ok || response.status === 204) {
                    output.innerHTML = '<span class="success">✅ API is healthy and accepting requests!</span>';
                } else {
                    output.innerHTML = `<span class="info">API responded with status: ${response.status}</span>`;
                }
            } catch (error) {
                output.innerHTML = `<span class="error">❌ Cannot connect to API: ${error.message}\n\nMake sure the backend is running on http://localhost:3001</span>`;
            }
        }

        // Initialize on page load
        window.onload = () => {
            testHealthCheck();
        };
    </script>
</body>
</html>
